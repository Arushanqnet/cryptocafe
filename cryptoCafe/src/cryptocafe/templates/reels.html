<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CryptoCafe - Reels</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  >

  <!-- Fabric.js library -->
  <script
    src="https://cdn.jsdelivr.net/npm/fabric@5.2.4/dist/fabric.min.js">
  </script>

  <!-- Font Awesome for icons -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    rel="stylesheet"
  >

  <style>
    /* Base page (dark theme, fullscreen) */
    html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background-color: #111;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #fff;
  overflow: hidden;
}

/* Container for our “Reels” content */
#reels-container {
  position: relative;
  width: 100vw;
  height: 100vh;
}

/* Fabric canvas covers entire container */
#reels-canvas {
  position: absolute;
  top: 0;
  left: 0;
}
.canvas-container { margin: 0 !important; }

/* ---- TOP BAR (back arrow + branding) ---- */
.top-bar {
  position: absolute;
  top: 10px;
  left: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 10;
  cursor: pointer;
  color: #fff;
  font-size: 20px;
  padding: 6px 10px;
  background: rgba(0,0,0,0.3);
  border-radius: 4px;
  transition: background 0.3s ease;
}
.top-bar:hover {
  background: rgba(0,0,0,0.5);
}
.top-bar i {
  font-size: 24px;
}

/* ---- RIGHT-SIDE ICONS (including new up/down arrows) ---- */
.right-icons {
  position: absolute;
  right: 15px;
  bottom: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  z-index: 5;
}
.icon-btn {
  color: #fff;
  font-size: 26px;
  cursor: pointer;
  transition: transform 0.2s ease;
  text-shadow: 0 0 10px rgba(0,0,0,0.5);
  position: relative; /* for the heart +1 animation */
}
.icon-btn:hover {
  transform: scale(1.2);
}

/* NEW: Heart icon styling when already “liked” */
.icon-btn.liked {
  color: red;          /* Bold red for a liked state */
  font-weight: bold;
  transform: none;     /* Or you can keep the hover scale if you prefer */
}

/* NEW: Like count text that sits near the heart icon */
.like-count-text {
  font-size: 1rem;
  color: #fff;
  margin-left: 4px;
}

/* ---- BOTTOM BAR (date & small translucent gradient) ---- */
.bottom-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.5rem 1rem;
  background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
  z-index: 5;
  color: #ccc;
  font-size: 0.85rem;
}
.date-text {
  opacity: 0.9;
}
/* “More Info” button on the right side of bottom bar */
.more-info-btn {
  cursor: pointer;
  color: #fff;
  opacity: 0.85;
  background: rgba(0,0,0,0.3);
  padding: 4px 10px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.9rem;
  transition: background 0.3s ease;
}
.more-info-btn:hover {
  background: rgba(0,0,0,0.5);
}

/* ---- CENTER TEXT (title/desc fade in) ---- */
.center-text {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 67%;
  max-width: 336px;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 4;
}
.article-title, .article-desc {
  background: rgba(0,0,0,0.5);
  border-radius: 8px;
  margin: 0.5rem auto;
  color: #fff;
  padding: 0.5rem 1rem;
  display: inline-block;
  max-width: 100%;
  animation-duration: 1s;
  animation-fill-mode: forwards;
  opacity: 0;
}
.article-title {
  animation-name: fadeFromLeft;
}
.article-desc {
  animation-name: fadeFromRight;
}
@keyframes fadeFromLeft {
  0% { transform: translateX(-50px); opacity: 0; }
  100% { transform: translateX(0); opacity: 1; }
}
@keyframes fadeFromRight {
  0% { transform: translateX(50px); opacity: 0; }
  100% { transform: translateX(0); opacity: 1; }
}

/* ---- SWIPE-UP INSTRUCTIONS ---- */
.swipe-up {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  text-align: center;
}
.swipe-up i {
  display: block;
  margin-bottom: 5px;
  animation: swipe 2s infinite;
}
@keyframes swipe {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}

/* ---- FLOATING +1 HEART ANIMATION WHEN LIKED ---- */
.floating-heart {
  position: absolute;
  color: #ff2e63; /* bright pinkish/red color */
  font-weight: bold;
  pointer-events: none; /* ignore clicks */
  opacity: 1;
  animation: floatUp 1s forwards ease;
  font-size: 1rem;
}
@keyframes floatUp {
  0% {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  50% {
    transform: translateY(-30px) scale(1.3);
  }
  100% {
    transform: translateY(-60px) scale(0.8);
    opacity: 0;
  }
}


    /* ---- BOTTOM OVERLAY / “PROFILE DRAWER” ---- */
    .bottom-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0,0,0,0.5);
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
      box-shadow: 0 -3px 10px rgba(0,0,0,0.5);
      transform: translateY(100%);
      transition: transform 0.4s ease;
      z-index: 999;
      padding: 1rem;
      backdrop-filter: blur(10px);
    }
    .bottom-overlay.open {
      transform: translateY(0);
    }
    .bottom-overlay-handle {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
    }
    .bottom-overlay-handle i {
      cursor: pointer;
      font-size: 24px;
      color: #999;
    }
    .bottom-overlay-content {
      color: #fff;
    }
    .profile-section {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1rem;
    }
    .profile-pic {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #666;
    }
    .username {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .source-link a {
      color: #0dcaf0;
      text-decoration: underline;
    }
    .tts-text {
      margin-top: 0.5rem;
      color: #ddd;
      line-height: 1.4;
    }
    .canvas-container{
      justify-self: center!important;
    }
  </style>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
  >

  <style>

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #06102B, #0D213E);
      color: #ECECEC;
    }

    /* Navbar - create a gradient effect and add a subtle shadow */
    .navbar {
      background: linear-gradient(135deg, #0077F5, #00CBFF);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }
    .navbar-brand {

    }
    .nav-link {
      color: #FFF !important;
      margin-right: 0.5rem;
    }
    .nav-link:hover {
      color: #F0F0F0 !important;
    }

    /* Container - add some spacing and subtle shadow */

    /* Card styling */

    .card-title {

    .text-muted {

    /* Full-Screen Overlay */
    #loadingOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);

      justify-content: center;
      align-items: center;

    }
    .overlay-content {
      text-align: center;

    .overlay-logo {

    .overlay-progress {

    .overlay-progress .progress-bar {

  </style>

<body>

  <!-- TOP BAR: “Back to home” arrow -->
  <div class="top-bar" id="back-home-btn">
    <i class="fas fa-arrow-left"></i>
  </div>

  <div id="reels-container">
    <!-- Fullscreen Fabric canvas -->
    <canvas id="reels-canvas" width="360" height="640"></canvas>

    <!-- Centered text overlay (title & description) -->
    <div class="center-text">
      <h2 class="article-title" id="title-overlay">Title</h2>
      <p class="article-desc" id="desc-overlay">Description content goes here</p>
    </div>

    <!-- Right-side icons (like, share, play/pause + up/down for reels) -->
    <div class="right-icons">
      <i class="fas fa-chevron-up icon-btn" id="prev-btn" title="Previous Reel"></i>
      
      <!-- Heart icon & like count. They’re hidden by default; shown in JS if 'options' is true -->
      <i class="fas fa-heart icon-btn" id="like-btn" title="Like" style="display: none;"></i>
      <span class="like-count-text" id="like-count" style="display:none;">0</span>

      <i class="fas fa-share icon-btn" id="share-btn" title="Share"></i>
      <i class="fas fa-play icon-btn" id="play-pause-icon" title="Play/Pause"></i>
      <i class="fas fa-chevron-down icon-btn" id="next-btn" title="Next Reel"></i>
    </div>

    <!-- Bottom bar: date on left, “More Info” on right -->
    <div class="bottom-bar">
      <div class="date-text" id="news-date">Thu, 26 Dec 2024 13:01:43 -0500</div>
      <div class="more-info-btn" id="more-info-btn">
        <i class="fas fa-info-circle"></i> More Info
      </div>
    </div>

    <!-- Swipe-up instructions -->
    <div class="swipe-up">
      <i class="fas fa-chevron-up"></i>
      Swipe/Scroll up for more
    </div>
  </div>

  <!-- BOTTOM OVERLAY (expanded info) -->
  <div class="bottom-overlay" id="bottom-overlay">
    <!-- Handle / close arrow -->
    <div class="bottom-overlay-handle">
      <i class="fas fa-chevron-down" id="overlay-close-btn"></i>
    </div>
    <div class="bottom-overlay-content">
      <div class="profile-section">
        <!-- Placeholder circle as a "profile pic" -->
        <div class="profile-pic"></div>
        <div class="username" id="overlay-username">CryptoCafe</div>
      </div>
      <div class="source-link">
        <a href="#" id="source-url" target="_blank">View Source</a>
      </div>
      <!-- If you still want to show TTS text, keep this. Otherwise, remove. -->
      <div class="tts-text" id="tts-text-overlay">No TTS Text</div>
    </div>
  </div>

  <!-- Server passes user's liked article IDs into liked_ids_json -->
  <script>
    // Step 1: Convert the Python list -> *valid* JSON
    // Step 2: Mark it safe so it doesn't get HTML-escaped
    const userLikedIds = JSON.parse('{{ liked_ids_json|tojson|safe }}');
    // Now userLikedIds is a real JS array, e.g. ["6","12"]
  
    // Debug:
    console.log("User liked IDs from server:", userLikedIds);
  
    // Convert to a Set
    const userLikedSet = new Set(userLikedIds.map(id => parseInt(id, 10)));
  </script>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
  </script>

  <script>
    // --------------- SETUP & DATA ---------------
    const START_INDEX = parseInt('{{ start_index }}');
    // The server passes "data" => array of reels. Each reel has { id, liked_count, ... }
    const newsItems   = JSON.parse('{{ data|tojson }}');

    // Initialize the Fabric.js canvas
    const canvas = new fabric.Canvas('reels-canvas', { renderOnAddRemove: false });
    canvas.skipTargetFind = true;

    // “Breathing” background animation references
    canvas.bgScale = 1.0;        
    canvas.bgScaleMin = 1.0;     
    canvas.bgScaleMax = 1.05;    
    canvas.bgScaleDir = 1;       
    canvas.bgAnimSpeed = 0.0002; 

    let audio     = new Audio();
    let isPaused  = false;
    let currentIndex = (START_INDEX >= 0 && START_INDEX < newsItems.length)
                       ? START_INDEX
                       : 0;

    // DOM references
    const titleOverlay    = document.getElementById('title-overlay');
    const descOverlay     = document.getElementById('desc-overlay');
    const dateEl          = document.getElementById('news-date');
    const playPauseIcon   = document.getElementById('play-pause-icon');
    const likeBtn         = document.getElementById('like-btn');
    const shareBtn        = document.getElementById('share-btn');
    const bottomOverlay   = document.getElementById('bottom-overlay');
    const moreInfoBtn     = document.getElementById('more-info-btn');
    const overlayCloseBtn = document.getElementById('overlay-close-btn');
    const sourceUrl       = document.getElementById('source-url');
    const ttsTextOverlay  = document.getElementById('tts-text-overlay');
    const overlayUsername = document.getElementById('overlay-username');
    const backHomeBtn     = document.getElementById('back-home-btn');
    const likeCountEl     = document.getElementById('like-count');

    // Arrow icons
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    // --------------- AUDIO EVENT HANDLERS ---------------
    audio.onended = () => {
      isPaused = false;
      playPauseIcon.classList.remove('fa-pause');
      playPauseIcon.classList.add('fa-play');
    };
    audio.onpause = () => {
      if (audio.currentTime < audio.duration) {
        isPaused = true;
        playPauseIcon.classList.remove('fa-pause');
        playPauseIcon.classList.add('fa-play');
      }
    };
    audio.onplay = () => {
      isPaused = false;
      playPauseIcon.classList.remove('fa-play', 'fa-pause');
      playPauseIcon.classList.add('fa-pause');
    };

    // --------------- PLAY / PAUSE ---------------
    function playAudioFromStart() {
      audio.pause();
      audio.currentTime = 0;
      audio.play();
    }
    function togglePlayPause() {
      if (audio.paused) {
        if (audio.currentTime === 0 || audio.currentTime >= audio.duration) {
          playAudioFromStart();
        } else {
          audio.play();
        }
      } else {
        audio.pause();
      }
    }

    // --------------- SHOW ONE ITEM ---------------
    async function showNewsItem(index) {
      if (index < 0 || index >= newsItems.length) return;
      currentIndex = index;
      canvas.clear();

      // Reset the text animations
      titleOverlay.style.animation = 'none';
      descOverlay.style.animation  = 'none';
      void titleOverlay.offsetWidth; // reflow hack
      void descOverlay.offsetWidth;
      titleOverlay.style.animation = 'fadeFromLeft 1s forwards';
      descOverlay.style.animation  = 'fadeFromRight 1s forwards';

      const item = newsItems[index];
      const {
        id,
        title       = "No Title",
        text        = "No Description",
        date        = "",
        image_url   = "https://via.placeholder.com/360x640.png?text=No+Image",
        tts_text    = "",
        news_url    = "#",
        username    = "CryptoCafe",
        mp3_name    = "",
        options     = false,
        liked_count = 0
      } = item;

      // Update textual elements
      titleOverlay.textContent    = title;
      descOverlay.textContent     = text;
      dateEl.textContent          = date;
      overlayUsername.textContent = username;
      sourceUrl.href              = news_url;
      ttsTextOverlay.textContent  = tts_text;

      // Show/hide like button and count depending on 'options'
      if (options) {
        likeBtn.style.display     = 'inline-block';
        likeCountEl.style.display = 'inline-block';
      } else {
        likeBtn.style.display     = 'none';
        likeCountEl.style.display = 'none';
      }

      // Display current liked count
      likeCountEl.textContent = liked_count;

      // If the user has already liked this article => highlight in red
      if (userLikedSet.has(id)) {
        likeBtn.classList.add('liked');  // .liked => bold red in CSS
      } else {
        likeBtn.classList.remove('liked');
      }

      // Start / reset audio for this reel
      audio.pause();
      audio.currentTime = 0;
      if (mp3_name) {
        audio.src = `/static/audio/${mp3_name}`;
        audio.play();
      }

      // Apply background cover
      await setBackgroundCover(image_url);
    }

    // --------------- BACKGROUND COVER + “Breathe” ANIMATION ---------------
    function setBackgroundCover(imageUrl) {
      return new Promise((resolve) => {
        fabric.Image.fromURL(
          imageUrl,
          (img) => {
            if (!img) {
              // fallback image if the URL fails
              fabric.Image.fromURL(
                'https://via.placeholder.com/360x640.png?text=No+Image',
                (placeholder) => {
                  coverImage(placeholder);
                  resolve();
                },
                { crossOrigin: 'anonymous' }
              );
            } else {
              coverImage(img);
              resolve();
            }
          },
          { crossOrigin: 'anonymous' }
        );
      });
    }

    function coverImage(imgObj) {
      const scaleRatio = Math.max(
        canvas.width / imgObj.width,
        canvas.height / imgObj.height
      );
      canvas.bgScaleMin = scaleRatio;
      canvas.bgScaleMax = scaleRatio * 1.05;  
      canvas.bgScale    = scaleRatio; 

      imgObj.scaleX = scaleRatio;
      imgObj.scaleY = scaleRatio;
      imgObj.set({
        originX: 'center',
        originY: 'center',
        left: canvas.width / 2,
        top:  canvas.height / 2
      });

      canvas.setBackgroundImage(
        imgObj,
        canvas.renderAll.bind(canvas)
      );
      canvas.backgroundImageObject = imgObj;
    }

    function animateBackground() {
      if (!canvas.backgroundImageObject) {
        requestAnimationFrame(animateBackground);
        return;
      }
      if (canvas.bgScaleDir === 1) {
        canvas.bgScale += canvas.bgAnimSpeed;
        if (canvas.bgScale >= canvas.bgScaleMax) {
          canvas.bgScale = canvas.bgScaleMax;
          canvas.bgScaleDir = -1;
        }
      } else {
        canvas.bgScale -= canvas.bgAnimSpeed;
        if (canvas.bgScale <= canvas.bgScaleMin) {
          canvas.bgScale = canvas.bgScaleMin;
          canvas.bgScaleDir = 1;
        }
      }
      canvas.backgroundImageObject.scaleX = canvas.bgScale;
      canvas.backgroundImageObject.scaleY = canvas.bgScale;
      canvas.renderAll();

      requestAnimationFrame(animateBackground);
    }
    requestAnimationFrame(animateBackground);

    // --------------- NAVIGATION (NEXT/PREV) ---------------
    function nextItem() {
      audio.pause();
      audio.currentTime = 0;
      currentIndex = (currentIndex + 1) % newsItems.length;
      showNewsItem(currentIndex);
    }
    function prevItem() {
      audio.pause();
      audio.currentTime = 0;
      currentIndex = (currentIndex - 1 + newsItems.length) % newsItems.length;
      showNewsItem(currentIndex);
    }

    // --------------- LIKE ANIMATION ---------------
    function showFloatingHeart(iconElem) {
      const span = document.createElement('span');
      span.classList.add('floating-heart');
      span.textContent = '+1 ❤️';
      const rect = iconElem.getBoundingClientRect();
      span.style.left = (rect.x + rect.width / 2) + 'px';
      span.style.top  = (rect.y + rect.height / 2) + 'px';
      document.body.appendChild(span);

      span.addEventListener('animationend', () => {
        document.body.removeChild(span);
      });
    }

    // --------------- LIKE HANDLER ---------------
    async function handleLikeClick() {
      const item = newsItems[currentIndex];
      const { id } = item;

      // If user already liked => do nothing
      if (userLikedSet.has(id)) {
        console.log("Already liked article:", id);
        return;
      }

      showFloatingHeart(likeBtn);
      console.log("Liking item with ID:", id);

      try {
        const response = await fetch("/like_article", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ article_id: id })
        });
        const data = await response.json();

        if (data.error) {
          console.error("Error liking article:", data.error);
          return;
        }
        if (data.success) {
          // Update local liked_count
          item.liked_count = data.liked_count;
          // Prevent re-like in this session
          userLikedSet.add(id);
          // Update UI
          likeBtn.classList.add('liked');
          likeCountEl.textContent = data.liked_count;
        }
      } catch (err) {
        console.error("Request error:", err);
      }
    }

    // --------------- EVENT LISTENERS ---------------
    document.addEventListener("DOMContentLoaded", function () {
      // Show the initial reel
      showNewsItem(currentIndex);
    });

    // Play/Pause
    playPauseIcon.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlayPause();
    });

    // Like
    likeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      handleLikeClick();
    });

    // Share
    shareBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const item = newsItems[currentIndex];
      console.log("Share clicked for item:", item.id || currentIndex);
      // your share logic
    });

    // Clicking background => toggle audio (except top-bar arrow)
    document.getElementById('reels-container').addEventListener('click', (e) => {
      if (e.target.closest('.top-bar')) return;
      togglePlayPause();
    });

    // Manual next/prev
    prevBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      prevItem();
    });
    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      nextItem();
    });

    // Swipe up/down => next/prev
    let startY = null;
    window.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
    });
    window.addEventListener('touchmove', (e) => {
      if (!startY) return;
      const deltaY = startY - e.touches[0].clientY;
      if (deltaY > 50) {
        nextItem();
        startY = null;
      } else if (deltaY < -50) {
        prevItem();
        startY = null;
      }
    });

    // Keyboard arrow up/down => next/prev
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') {
        nextItem();
      } else if (e.key === 'ArrowDown') {
        prevItem();
      }
    });

    // Scroll wheel => next/prev
    let scrollTimeout = null;
    window.addEventListener('wheel', (e) => {
      if (scrollTimeout) return;
      scrollTimeout = setTimeout(() => {
        scrollTimeout = null;
      }, 300);
      if (e.deltaY > 0) {
        nextItem();
      } else {
        prevItem();
      }
    });

    // "Back to Home" arrow => stop audio & navigate
    backHomeBtn.addEventListener('click', () => {
      audio.pause();
      audio.currentTime = 0;
      window.location.href = '/';
    });

    // Cleanup audio on exit
    window.addEventListener('popstate', () => {
      audio.pause();
      audio.currentTime = 0;
    });
    window.addEventListener('beforeunload', () => {
      audio.pause();
      audio.currentTime = 0;
    });

    // Show/hide bottom overlay
    moreInfoBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      bottomOverlay.classList.add('open');
    });
    overlayCloseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      bottomOverlay.classList.remove('open');
    });
  </script>
</body>
</html>
